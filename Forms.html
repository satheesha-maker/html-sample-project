<html>

<title>  Registration Form Page   </title>

<body style="background-color:RGB(20,150,250);">

<h1>  Registration Form Page   </h1>


<form>
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname"><br>

  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname">

  <h3>  Area of Interest </h3>

  <input type="radio" id="web" name="fav_language" value="Web Development">
  <label for="html">Web Development</label><br>
  
  <input type="radio" id="mobile" name="fav_language" value="Mobile App Development">
  <label for="css">Mobile App Development</label><br>
  
  <input type="radio" id="coding" name="fav_language" value="Code Debugging">
  <label for="javascript">Code Debugging</label>


  <h3>  Select the Subject You Learned</h3>

  <input type="checkbox" id="subject1" name="vehicle1" value="HTML">
  <label for="Subject1"> HTML</label><br>
  <input type="checkbox" id="subject2" name="vehicle2" value="CSS">
  <label for="Subject2"> CSS</label><br>
  <input type="checkbox" id="subject3" name="vehicle3" value="JAVA SCRIPT">
  <label for="Subject3"> JAVA SCRIPT</label><br>
  <input type="checkbox" id="subject4" name="vehicle3" value="PYTHON">
  <label for="Subject4"> PYTHON </label><br><br>

  <input type="submit" value="Submit">

</form>

</body>
</html>
